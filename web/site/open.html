<style>
  .rb { max-width: 640px; margin: 0 auto; padding-bottom: 40px; }
  .rb h1 { margin: 8px 0 4px; font-size: clamp(26px, 6vw, 36px); line-height: 1.15; }
  .rb .stats { color: var(--soft); margin: 0 0 18px; }
  .rb svg { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; }
  .rb .code { font-family: var(--mono); font-size: 34px; letter-spacing: .18em; font-weight: 700; margin: 4px 0 2px; }
  .rb .ctas { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
  .rb .ctas .cta.alt { margin-left: 0; }
  .rb ol { padding-left: 20px; line-height: 1.6; }
  .rb .card { margin: 18px 0; }
  .rb .card p + p { margin-top: 8px; }
</style>
</head>
