# Roadbook for iOS — XcodeGen project description. On a Mac: `brew install xcodegen && xcodegen generate`,
# then open Roadbook.xcodeproj. The Kotlin engine (../core) is built into FoldCore.framework by a run-script
# phase on every build, so Xcode needs a JDK 17 on the PATH (see README.md).
name: Roadbook
options:
  bundleIdPrefix: com.hondogarage
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # your Apple Developer team id (Xcode → Settings → Accounts shows it); or pick the team in Xcode's Signing tab
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.10.0"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
schemes:
  Roadbook:
    build:
      targets:
        Roadbook: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
targets:
  Roadbook:
    type: application
    platform: iOS
    sources:
      - path: Roadbook
        excludes: ["Info.plist", "Roadbook.entitlements"]
      - path: Shared
      # the map's fonts, sprites and layer templates are the same files the Android app ships
      - path: ../app/src/main/assets/fonts
        type: folder
        buildPhase: resources
      - path: ../app/src/main/assets/sprites
        type: folder
        buildPhase: resources
      - path: ../app/src/main/assets/style
        type: folder
        buildPhase: resources
    dependencies:
      - package: MapLibre
      - package: ZIPFoundation
      - target: RoadbookWidget
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Roadbook/Info.plist
        CODE_SIGN_ENTITLEMENTS: Roadbook/Roadbook.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.hondogarage.roadbook
        PRODUCT_NAME: Roadbook
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # FoldCore.framework (static) is built by the script phase below into this directory
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../core/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework FoldCore"
        SWIFT_OBJC_INTEROP_MODE: objc
    preBuildScripts:
      - name: Build FoldCore (Kotlin Multiplatform)
        script: |
          # Builds the shared Kotlin engine for the SDK and architecture Xcode is building, and copies the
          # framework where FRAMEWORK_SEARCH_PATHS looks. Needs a JDK 17+; JAVA_HOME is set for the common installs.
          set -e
          cd "$SRCROOT/.."
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home -v 17+ 2>/dev/null || true)}"
          # the engine is always built optimised: Kotlin/Native's debug build is many times slower on the router,
          # and only the Swift side is ever debugged from Xcode
          case "$SDK_NAME" in iphonesimulator*) T=IosSimulatorArm64; D=iosSimulatorArm64;; *) T=IosArm64; D=iosArm64;; esac
          ./gradlew --no-daemon -q ":core:linkReleaseFramework$T"
          # copied into place by hand, so a stale framework from an earlier build can never be the one linked
          DEST="$SRCROOT/../core/build/xcode-frameworks/$CONFIGURATION/$SDK_NAME"
          rm -rf "$DEST"; mkdir -p "$DEST"
          cp -R "core/build/bin/$D/releaseFramework/FoldCore.framework" "$DEST/"
        # no outputFiles on purpose: Xcode would skip the step once the framework exists, and the Kotlin would go stale;
        # Gradle is incremental, so an unchanged engine costs a few seconds here
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Build number from git
        script: |
          # every upload to App Store Connect needs a higher build number; the commit count is one, and the app and
          # the widget (which must match) both compute the same value
          N=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $N" "$TARGET_BUILD_DIR/$INFOPLIST_PATH" || true
        basedOnDependencyAnalysis: false
  RoadbookWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: RoadbookWidget
        excludes: ["Info.plist"]
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: RoadbookWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hondogarage.roadbook.widget
        PRODUCT_NAME: RoadbookWidget
        SKIP_INSTALL: YES
    postBuildScripts:
      - name: Build number from git
        script: |
          # every upload to App Store Connect needs a higher build number; the commit count is one, and the app and
          # the widget (which must match) both compute the same value
          N=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 1)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $N" "$TARGET_BUILD_DIR/$INFOPLIST_PATH" || true
        basedOnDependencyAnalysis: false
