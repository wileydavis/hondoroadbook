# The natural-voice pack the apps download on request (MAPS → VOICE): Kokoro-82M v1.0 (Apache-2.0), int8, as
# packaged for sherpa-onnx, cut to English — the model, the 54 voice styles (ids unchanged), the US-English lexicon,
# and the same English espeak-ng data the Android app ships (for words the lexicon lacks). Uploaded to the rolling
# "packs" release as kokoro-en-v1.zip; the site serves it at /packs/voices/kokoro-en-v1.zip.
name: voices

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  kokoro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and cut the pack
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 -o k.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2
          tar xjf k.tar.bz2
          K=kokoro-int8-multi-lang-v1_0
          mkdir -p pack
          cp "$K/model.int8.onnx" "$K/voices.bin" "$K/tokens.txt" "$K/lexicon-us-en.txt" "$K/LICENSE" pack/
          cp -r app/src/main/assets/tts/espeak-ng-data pack/
          printf '%s\n' "Roadbook natural voice: Kokoro-82M v1.0 (Apache-2.0, hexgrad/Kokoro-82M), int8, as packaged for sherpa-onnx" \
            "(k2-fsa/sherpa-onnx tts-models kokoro-int8-multi-lang-v1_0), cut to English: the model, all 54 voice styles" \
            "(ids unchanged), the US-English lexicon, and espeak-ng's English data for words the lexicon lacks." > pack/README.txt
          (cd pack && zip -q -r -9 ../kokoro-en-v1.zip .)
          ls -la kokoro-en-v1.zip
      - name: Upload
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload packs -R "$GITHUB_REPOSITORY" --clobber kokoro-en-v1.zip
