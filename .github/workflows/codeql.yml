# Static analysis (GitHub CodeQL) of the code that runs on phones and on the site: Kotlin (core and Android app) and
# JavaScript (the planner and the Worker) on every push; Swift (the iPhone app) weekly, on a Mac. Findings appear
# under Security → Code scanning.
name: codeql

on:
  push: { branches: [main], paths-ignore: ["dist/**", "**/*.md"] }
  pull_request: { branches: [main] }
  schedule: [{ cron: "23 7 * * 1" }]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions: { contents: read, security-events: write, actions: read }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: java-kotlin, os: ubuntu-latest, build: manual }
          - { language: javascript-typescript, os: ubuntu-latest, build: none }
          - { language: swift, os: macos-latest, build: manual }
    steps:
      - name: Swift only on the weekly run (a Mac build is slow)
        if: matrix.language == 'swift' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: echo "skipping Swift on this event" && echo "SKIP=1" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.SKIP != '1'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: env.SKIP != '1' && matrix.language != 'javascript-typescript'
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: env.SKIP != '1' && matrix.language == 'java-kotlin'
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        if: env.SKIP != '1'
        with: { languages: "${{ matrix.language }}", build-mode: "${{ matrix.build }}", queries: security-and-quality }
      - name: Build Kotlin (in-process, so CodeQL sees the compiler)
        if: env.SKIP != '1' && matrix.language == 'java-kotlin'
        run: ./gradlew --no-daemon --no-build-cache -Pkotlin.compiler.execution.strategy=in-process :core:compileKotlinJvm :app:compileDebugKotlin
      - name: Build Swift
        if: env.SKIP != '1' && matrix.language == 'swift'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1); sudo xcode-select -s "$X"
          ios/fetch-vendor.sh && tools/fetch-voice.sh
          brew install xcodegen && (cd ios && xcodegen generate)
          xcodebuild -project ios/Roadbook.xcodeproj -scheme Roadbook -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 50
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        if: env.SKIP != '1'
        with: { category: "/language:${{ matrix.language }}" }
