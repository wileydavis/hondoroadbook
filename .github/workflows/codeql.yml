# Static analysis (GitHub CodeQL) of the code that runs on phones and on the site: Kotlin (core and Android app) and
# JavaScript (the planner and the Worker) on every push; Swift (the iPhone app) weekly, on a Mac. Findings appear
# under Security → Code scanning.
name: codeql

on:
  push: { branches: [main], paths-ignore: ["dist/**", "**/*.md"] }
  pull_request: { branches: [main] }
  schedule: [{ cron: "23 7 * * 1" }]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions: { contents: read, security-events: write, actions: read }
    strategy:
      fail-fast: false
      # Swift only on the weekly run or by hand: a Mac job on every push waited for a scarce macOS runner and was
      # often cancelled before it started, which marked the whole run failed. On other events it is not in the matrix.
      matrix:
        include: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[{"language":"java-kotlin","os":"ubuntu-latest","build":"manual"},{"language":"javascript-typescript","os":"ubuntu-latest","build":"none"},{"language":"swift","os":"macos-latest","build":"manual"}]' || '[{"language":"java-kotlin","os":"ubuntu-latest","build":"manual"},{"language":"javascript-typescript","os":"ubuntu-latest","build":"none"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: matrix.language != 'javascript-typescript'
        with: { distribution: temurin, java-version: "17" }
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with: { languages: "${{ matrix.language }}", build-mode: "${{ matrix.build }}", queries: security-and-quality }
      # the Linux runner has the Android SDK already (ANDROID_HOME)
      - name: Build Kotlin (in-process, so CodeQL sees the compiler)
        if: matrix.language == 'java-kotlin'
        run: ./gradlew --no-daemon --no-build-cache -Pkotlin.compiler.execution.strategy=in-process :core:compileKotlinJvm :app:compileDebugKotlin
      - name: Build Swift
        if: matrix.language == 'swift'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1); sudo xcode-select -s "$X"
          ios/fetch-vendor.sh && tools/fetch-voice.sh
          brew install xcodegen && (cd ios && xcodegen generate)
          xcodebuild -project ios/Roadbook.xcodeproj -scheme Roadbook -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 50
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with: { category: "/language:${{ matrix.language }}" }
