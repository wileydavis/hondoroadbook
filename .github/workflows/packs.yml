# Builds map packs on GitHub's runners and publishes them where hondoroadbook.com/packs/ serves them.
# Free for a public repository; every region × kind is its own job, so one failure never costs the others.
#
# Regions live in packer/regions.json (US states, Canadian provinces and territories, Baja California, the EU). Kinds:
#   roads   — OSM extract → roads, routing graph, address index, vector tiles (fold-packer.jar)
#   terrain — hillshade raster from AWS Terrain Tiles (packer/terrain/build_terrain.py)
#   names   — place names for the apps' search: GNIS (US states) and OSM's passes, springs, peaks… (tools/names_pack.py).
#             Small, and kept in R2 only (the release holds at most 1,000 files): the catalog reads their sidecars there.
# Packs always go to the rolling GitHub release "packs" (no setup needed; the Worker proxies /packs/*
# from there), and also to the Cloudflare R2 bucket when R2_ACCOUNT_ID / R2_ACCESS_KEY_ID /
# R2_SECRET_ACCESS_KEY exist (web/README.md). The last job rebuilds catalog.json from every sidecar.
name: packs

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Space-separated region slugs from packer/regions.json, or 'all'"
        default: "montana idaho wyoming baja-california"
      kinds:
        description: "Space-separated kinds: roads terrain names"
        default: "roads terrain names"
  schedule:
    - cron: "17 9 3 * *"     # monthly refresh of everything

concurrency:
  group: packs
  cancel-in-progress: false

permissions:
  contents: write

env:
  BUCKET: roadbook-packs
  SITE: https://hondoroadbook.com/packs
  RELEASE_TAG: packs

jobs:
  packer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon -q :core:test :packer:test :packer:fatJar     # the tests gate every pack build
      - uses: actions/upload-artifact@v4
        with: { name: fold-packer, path: packer/build/libs/fold-packer.jar, retention-days: 7 }
      - name: Make sure the rolling release exists
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --title "Map packs" --notes "Prebuilt map packs. The app and hondoroadbook.com/packs/ read catalog.json here. Rebuilt monthly from OpenStreetMap, Protomaps and AWS Terrain Tiles."

  plan:
    runs-on: ubuntu-latest
    outputs:
      roads: ${{ steps.m.outputs.roads }}
      terrain: ${{ steps.m.outputs.terrain }}
      has_roads: ${{ steps.m.outputs.has_roads }}
      has_terrain: ${{ steps.m.outputs.has_terrain }}
      names: ${{ steps.m.outputs.names }}
      has_names: ${{ steps.m.outputs.has_names }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        shell: bash
        run: |
          WANT="${{ github.event.inputs.regions || 'all' }}"
          KINDS="${{ github.event.inputs.kinds || 'roads terrain names' }}"
          [ "$WANT" = "all" ] && WANT="$(jq -r 'keys[]' packer/regions.json | tr '\n' ' ')"
          LIST=$(printf '%s\n' $WANT | jq -R . | jq -sc .)
          echo "roads=$(jq -c --argjson l "$LIST" '{region: $l}' <<< '{}')" >> "$GITHUB_OUTPUT"
          echo "terrain=$(jq -c --argjson l "$LIST" '{region: $l}' <<< '{}')" >> "$GITHUB_OUTPUT"
          echo "has_roads=$([[ " $KINDS " == *" roads "* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_terrain=$([[ " $KINDS " == *" terrain "* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "names=$(jq -c --argjson l "$LIST" '{region: $l}' <<< '{}')" >> "$GITHUB_OUTPUT"
          echo "has_names=$([[ " $KINDS " == *" names "* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # every extract asked for must exist at Geofabrik before a hundred jobs start: a misspelt slug fails here, by name
          curl -fsSL --retry 5 --retry-all-errors -o index.json https://download.geofabrik.de/index-v1-nogeom.json
          missing=""
          for r in $WANT; do
            pbf=$(jq -r --arg r "$r" '.[$r].pbf // empty' packer/regions.json); [ -n "$pbf" ] || { missing="$missing $r(not in regions.json)"; continue; }
            jq -e --arg p "/$pbf" 'any(.features[]; (.properties.urls.pbf // "") | endswith($p))' index.json >/dev/null || missing="$missing $r($pbf)"
          done
          [ -z "$missing" ] || { echo "::error::No Geofabrik extract for:$missing"; exit 1; }

  roads:
    needs: [packer, plan]
    if: needs.plan.outputs.has_roads == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 6          # be polite to Geofabrik and Protomaps
      matrix: ${{ fromJson(needs.plan.outputs.roads) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/download-artifact@v4
        with: { name: fold-packer }
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - name: Build
        shell: bash
        run: |
          r="${{ matrix.region }}"
          R=$(jq -c --arg r "$r" '.[$r]' packer/regions.json); [ "$R" != "null" ] || { echo "unknown region $r"; exit 1; }
          name=$(jq -r .name <<< "$R"); group=$(jq -r .group <<< "$R"); path=$(jq -r .path <<< "$R"); pbf=$(jq -r .pbf <<< "$R")
          curl -fL --retry 5 --retry-all-errors -o region.osm.pbf "https://download.geofabrik.de/$pbf"
          extra="--max-zoom $(jq -r '.max_zoom // 15' <<< "$R")"
          bbox=$(jq -r 'if .bbox then (.bbox | map(tostring) | join(",")) else "" end' <<< "$R"); [ -n "$bbox" ] && extra="$extra --bbox $bbox"
          java -Xmx12g -jar fold-packer.jar --pbf region.osm.pbf --out "$r-roads.mappack" --name "$name" $extra
          rm -f region.osm.pbf
          unzip -p "$r-roads.mappack" pack.txt > pack.txt
          IFS=, read -r minLat minLon maxLat maxLon <<< "$(grep '^bbox=' pack.txt | cut -d= -f2)"
          jq -n --arg id "$path-$r-roads" --arg name "$name" --arg region "$name" --arg group "$group" --arg url "$SITE/$path/$r-roads.mappack" --argjson bytes "$(stat -c %s "$r-roads.mappack")" \
                --arg built "$(grep '^created=' pack.txt | cut -d= -f2 | cut -c1-10)" --argjson bbox "[$minLon,$minLat,$maxLon,$maxLat]" \
                '{id:$id, name:$name, region:$region, group:$group, kind:"roads", url:$url, bytes:$bytes, built:$built, bbox:$bbox}' > "$r-roads.json"
          cat "$r-roads.json"
      - name: Publish to the packs release
        env: { GH_TOKEN: "${{ github.token }}" }
        # the pack first, the sidecar only once the pack is really there: a failed upload must not reach the catalog
        run: |
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber "${{ matrix.region }}-roads.mappack"
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber "${{ matrix.region }}-roads.json"
      - name: Also copy to R2 (when configured)
        if: ${{ env.R2_KEY != '' }}
        env:
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 https://rclone.org/install.sh | sudo bash >/dev/null
          r="${{ matrix.region }}"; path=$(jq -r --arg r "$r" '.[$r].path' packer/regions.json)
          rclone copyto --ignore-times --s3-upload-cutoff 200M --s3-chunk-size 64M --s3-upload-concurrency 4 "$r-roads.mappack" "r2:$BUCKET/$path/$r-roads.mappack"
          rclone copyto --ignore-times "$r-roads.json" "r2:$BUCKET/$path/$r-roads.json"

  terrain:
    needs: [packer, plan]
    if: needs.plan.outputs.has_terrain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      max-parallel: 4          # the elevation tiles come from a public S3 bucket; keep it civil
      matrix: ${{ fromJson(needs.plan.outputs.terrain) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy pillow pmtiles requests
      - name: Hillshade alignment test (a mountain shades its own tile)
        run: python3 -I packer/terrain/test_alignment.py
      - name: Build
        shell: bash
        run: |
          r="${{ matrix.region }}"
          R=$(jq -c --arg r "$r" '.[$r]' packer/regions.json); [ "$R" != "null" ] || { echo "unknown region $r"; exit 1; }
          name=$(jq -r .name <<< "$R"); group=$(jq -r .group <<< "$R"); path=$(jq -r .path <<< "$R"); zoom=$(jq -r '.terrain_zoom // 13' <<< "$R")
          bbox=$(jq -r 'if .bbox then (.bbox | map(tostring) | join(",")) else "" end' <<< "$R")
          if [ -z "$bbox" ]; then
            # the region's extent from Geofabrik's index (same source as the roads pack)
            gf=$(jq -r .geofabrik <<< "$R"); pbf=$(jq -r .pbf <<< "$R")
            curl -fsSL --retry 5 -o index.json https://download.geofabrik.de/index-v1.json
            bbox=$(python3 -c "
          import json,sys
          # the index entry is found by its download URL (the same one the roads job fetched), falling back to the id spellings
          fs=json.load(open('index.json'))['features']
          byurl=[x for x in fs if x['properties'].get('urls',{}).get('pbf','').endswith('/$pbf')]
          f=(byurl or [x for x in fs if x['properties']['id']=='$gf'] or [x for x in fs if x['properties']['id'].endswith('/$gf')] or sys.exit('no Geofabrik index entry for $pbf'))[0]
          def pts(c):
              if isinstance(c[0],(int,float)): yield c
              else:
                  for k in c: yield from pts(k)
          p=list(pts(f['geometry']['coordinates']))
          print(','.join('%.4f'%v for v in (min(x for x,y in p)-0.05,min(y for x,y in p)-0.05,max(x for x,y in p)+0.05,max(y for x,y in p)+0.05)))")
          fi
          echo "bbox $bbox zoom $zoom"
          python3 packer/terrain/build_terrain.py --name "$name terrain" --region "$name" --bbox="$bbox" --out "$r-terrain.mappack" --max-zoom "$zoom"
          IFS=, read -r minLon minLat maxLon maxLat <<< "$bbox"
          jq -n --arg id "$path-$r-terrain" --arg name "$name terrain" --arg region "$name" --arg group "$group" --arg url "$SITE/$path/$r-terrain.mappack" --argjson bytes "$(stat -c %s "$r-terrain.mappack")" \
                --arg built "$(date -u +%F)" --argjson bbox "[$minLon,$minLat,$maxLon,$maxLat]" \
                '{id:$id, name:$name, region:$region, group:$group, kind:"terrain", url:$url, bytes:$bytes, built:$built, bbox:$bbox, notes:"hillshade; draws under the roads"}' > "$r-terrain.json"
          cat "$r-terrain.json"
      - name: Publish to the packs release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber "${{ matrix.region }}-terrain.mappack"
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber "${{ matrix.region }}-terrain.json"
      - name: Also copy to R2 (when configured)
        if: ${{ env.R2_KEY != '' }}
        env:
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 https://rclone.org/install.sh | sudo bash >/dev/null
          r="${{ matrix.region }}"; path=$(jq -r --arg r "$r" '.[$r].path' packer/regions.json)
          rclone copyto --ignore-times "$r-terrain.mappack" "r2:$BUCKET/$path/$r-terrain.mappack"
          rclone copyto --ignore-times "$r-terrain.json" "r2:$BUCKET/$path/$r-terrain.json"

  gnis:
    needs: [plan]
    if: needs.plan.outputs.has_names == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GNIS, cut by state (USGS Geographic Names Information System, public domain)
        run: |
          set -euo pipefail
          B=https://prd-tnm.s3.amazonaws.com
          K=$(curl -fsSL --retry 5 "$B/?list-type=2&prefix=StagedProducts/GeographicNames/DomesticNames/" | grep -o '<Key>[^<]*National[^<]*Text[^<]*\.zip</Key>' | sed 's/<[^>]*>//g' | head -1)
          curl -fsSL --retry 5 -o dom.zip "$B/$K"
          curl -fsSL --retry 5 -o all.zip "$B/StagedProducts/GeographicNames/Topical/AllNames_National_Text.zip"
          mkdir -p dom all; unzip -q dom.zip -d dom; unzip -q all.zip -d all
          python3 tools/names_pack.py split "$(find dom -iname '*.txt' -size +10M | head -1)" "$(find all -iname '*.txt' -size +10M | head -1)" gnis
          ls gnis | wc -l
      - uses: actions/upload-artifact@v4
        with: { name: gnis-by-state, path: gnis, retention-days: 3 }

  names:
    needs: [plan, gnis]
    if: always() && needs.plan.outputs.has_names == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.plan.outputs.names) }}
    env:
      R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true            # outside the US there is no GNIS: OpenStreetMap alone
        with: { name: gnis-by-state, path: gnis }
      - name: Build
        run: |
          set -euo pipefail
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y osmium-tool >/dev/null
          r="${{ matrix.region }}"
          R=$(jq -c --arg r "$r" '.[$r]' packer/regions.json); [ "$R" != "null" ] || { echo "unknown region $r"; exit 1; }
          name=$(jq -r .name <<< "$R"); group=$(jq -r .group <<< "$R"); path=$(jq -r .path <<< "$R"); pbf=$(jq -r .pbf <<< "$R")
          curl -fL --retry 5 --retry-all-errors -s -o region.osm.pbf "https://download.geofabrik.de/$pbf"
          osmium tags-filter -O -o extras.osm.pbf region.osm.pbf \
            n/natural=hot_spring,geyser,spring,saddle,peak,volcano,arch,cave_entrance nw/mountain_pass=yes w/natural=hot_spring \
            n/waterway=waterfall n/tourism=viewpoint n/highway=trailhead
          rm -f region.osm.pbf
          osmium export -O -f geojsonseq -o extras.geojsonseq extras.osm.pbf
          gnis=""; [ "$path" = us ] && [ -f "gnis/$name.tsv" ] && gnis="--gnis gnis/$name.tsv"
          python3 tools/names_pack.py build --name "$name place names" --region "$name" $gnis --osm extras.geojsonseq --out "$r-names.mappack"
          unzip -p "$r-names.mappack" pack.txt > pack.txt
          IFS=, read -r minLat minLon maxLat maxLon <<< "$(grep '^bbox=' pack.txt | cut -d= -f2)"
          jq -n --arg id "$path-$r-names" --arg name "$name place names" --arg region "$name" --arg group "$group" --arg url "$SITE/$path/$r-names.mappack" --argjson bytes "$(stat -c %s "$r-names.mappack")" \
                --arg built "$(grep '^created=' pack.txt | cut -d= -f2 | cut -c1-10)" --argjson bbox "[$minLon,$minLat,$maxLon,$maxLat]" \
                '{id:$id, name:$name, region:$region, group:$group, kind:"names", url:$url, bytes:$bytes, built:$built, bbox:$bbox, notes:"passes, springs, peaks and other named places, for search"}' > "$r-names.json"
          cat "$r-names.json"
      - name: Publish to R2
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 https://rclone.org/install.sh | sudo bash >/dev/null
          r="${{ matrix.region }}"; path=$(jq -r --arg r "$r" '.[$r].path' packer/regions.json)
          # the pack first, the sidecar only once the pack is really there
          rclone copyto --ignore-times "$r-names.mappack" "r2:$BUCKET/$path/$r-names.mappack"
          rclone copyto --ignore-times "$r-names.json" "r2:$BUCKET/$path/$r-names.json"

  catalog:
    needs: [roads, terrain, names]
    if: always()
    runs-on: ubuntu-latest
    env:
      R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/download-artifact@v4
        with: { name: fold-packer }
      - name: Continent overview tiles for the planner (zoom 0-7, one small file instead of fifty packs)
        run: |
          java -jar fold-packer.jar --tiles-only yes --bbox "-170,14,-50,72;-25,27,45,72" --max-zoom 7 --out na-overview.pmtiles   # North America; Europe (the name stays: the planner asks for it)
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber na-overview.pmtiles
      - name: Rebuild catalog.json from every sidecar on the release
        run: |
          mkdir meta && cd meta
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -E '\.json$' | grep -v '^catalog.json$' | while read -r a; do gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p "$a" || true; done
          cd ..
          # the names packs' sidecars live in R2 only
          if [ -n "$R2_KEY" ]; then command -v rclone >/dev/null || curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 https://rclone.org/install.sh | sudo bash >/dev/null; rclone copy r2:$BUCKET meta/r2 --include "*/*-names.json"; fi
          find meta -name '*.json' -print0 | xargs -0 cat | jq -s --arg d "$(date -u +%F)" '{version: 1, updated: $d, packs: .}' > catalog.json
          jq -r '.packs[] | "\(.name)\t\(.kind)\t\(.bytes/1e6|floor) MB"' catalog.json
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber catalog.json
      - name: Mirror to R2 (when configured)
        if: ${{ env.R2_KEY != '' }}
        run: |
          command -v rclone >/dev/null || curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 https://rclone.org/install.sh | sudo bash >/dev/null
          rclone copyto --ignore-times catalog.json "r2:$BUCKET/catalog.json"
          rclone copyto --ignore-times na-overview.pmtiles "r2:$BUCKET/na-overview.pmtiles"
