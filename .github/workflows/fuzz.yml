# Coverage-guided fuzzing (Jazzer) of every parser that reads other people's input: GPX, roll-chart JSON, share
# codes, pack manifests, search indexes, routing graphs, spoken text (core/src/jvmTest/…/fuzz/ParserFuzzTest.kt).
# The shared core is the same code on both phones. A crash fails the run and its input is kept as an artifact: add it
# to the target's Inputs folder with the fix, so it is replayed by every test run after.
name: fuzz

on:
  pull_request: { paths: ["core/**"] }
  schedule: [{ cron: "7 9 * * 3" }]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { target: [gpx, chartJson, shareFrames, packManifest, searchIndex, graph, spokenText] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: "17" }
      - name: Fuzz ${{ matrix.target }}
        env: { JAZZER_FUZZ: "1" }
        run: ./gradlew --no-daemon :core:jvmTest --tests "fold.core.fuzz.ParserFuzzTest.${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: "crash-${{ matrix.target }}", path: "core/src/jvmTest/resources/fold/core/fuzz/ParserFuzzTestInputs/${{ matrix.target }}/crash-*" }
