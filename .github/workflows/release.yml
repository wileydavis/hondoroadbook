# Builds and signs the APK when a tag like v0.2 is pushed, and attaches it to a GitHub release.
# The site links to .../releases/latest/download/roadbook.apk, so a new tag is a new download.
#
# Secrets: ROADBOOK_KEYSTORE_B64 (base64 of keys/roadbook-release.jks), ROADBOOK_KEYSTORE_PASSWORD.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon -q :core:test :app:assembleRelease :packer:fatJar
      - name: Sign
        env:
          RB_KS: ${{ secrets.ROADBOOK_KEYSTORE_B64 }}
          RB_PW: ${{ secrets.ROADBOOK_KEYSTORE_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"; mkdir -p out
          sign() { # unsigned apk, keystore b64, password, alias, out
            [ -n "$2" ] || { echo "no keystore for $5, skipping"; return 0; }
            echo "$2" | base64 -d > ks.jks
            "$BT/zipalign" -f -p 4 "$1" aligned.apk
            "$BT/apksigner" sign --ks ks.jks --ks-key-alias "$4" --ks-pass "pass:$3" --key-pass "pass:$3" --out "out/$5" aligned.apk
            "$BT/apksigner" verify "out/$5"; rm -f ks.jks aligned.apk
          }
          sign app/build/outputs/apk/release/app-release-unsigned.apk "$RB_KS" "$RB_PW" roadbook roadbook.apk
          cp packer/build/libs/fold-packer.jar out/; cp dist/build-states.sh out/
          ls -la out
      - name: Publish to hondoroadbook.com/download/
        if: ${{ env.R2_KEY != '' }}
        env:
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          for f in out/*.apk; do rclone copyto "$f" "r2:roadbook-packs/app/$(basename "$f")"; done
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        with: { name: apks, path: out/* }
