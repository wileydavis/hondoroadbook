# Tells GitHub which Gradle libraries the apps are built from, so Dependabot can warn about known vulnerabilities in
# them (Security → Dependabot). Kotlin/Gradle dependencies are not found by reading files alone.
name: deps

on:
  push: { branches: [main], paths: ["**/*.gradle.kts", "gradle/**", "settings.gradle.kts"] }
  schedule: [{ cron: "41 6 * * 1" }]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
