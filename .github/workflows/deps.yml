# Tells GitHub which Gradle libraries the apps are built from, so Dependabot can warn about known vulnerabilities in
# them (Security → Dependabot). Kotlin/Gradle dependencies are not found by reading files alone.
name: deps

on:
  push: { branches: [main], paths: ["**/*.gradle.kts", "gradle/**", "settings.gradle.kts"] }
  schedule: [{ cron: "41 6 * * 1" }]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: "17" }
      # the runner has the Android SDK already (ANDROID_HOME)
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
